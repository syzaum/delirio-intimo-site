<script>
const API_URL="https://script.google.com/macros/s/AKfycbxMqXwGjTAFWJ5HDCvmC8gbuYM89oIrY1q7UxhicsPAOPnIB5BKxJo0ROGZiwvFQY8ZRw/exec";
const CATEGORIAS=[
 {nome:"Sex Shop",descricao:"Produtos para seus momentos de prazer."},
 {nome:"Cosméticos",descricao:"Cuidados e produtos para o seu corpo."},
 {nome:"Lingeries",descricao:"Peças para vestir do seu jeito."},
 {nome:"Conjuntos",descricao:"Combinações pensadas para você."},
 {nome:"Acessórios",descricao:"Detalhes que completam sua escolha."},
 {nome:"Biquínis",descricao:"Modelos para aproveitar os dias de sol."},
 {nome:"Linha Noite",descricao:"Baby dolls, camisolas e peças para seus momentos de descanso."}
];
function normalizarTexto(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ").toLowerCase();}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function carregarCategorias(){
 const el=document.getElementById("listaCategorias");
 try{
  const r=await fetch(API_URL+"?acao=produtos",{cache:"no-store"});
  const d=await r.json();
  const produtos=(d.produtos||[]).map(p=>{if(!p.categoriaComercial)p.categoriaComercial=p.categoria||"";if(!p.fotos)p.fotos=[];if(!p.fotoUrl&&p.fotos.length)p.fotoUrl=p.fotos[0].url||"";return p;});
  el.innerHTML=CATEGORIAS.map((c,i)=>{
   const p=produtos.find(x=>normalizarTexto(x.categoriaComercial)===normalizarTexto(c.nome)&&x.fotoUrl);
   const img=p?'<img class="catImg" src="'+esc(imagemCapaProduto(p))+'" alt="" loading="lazy"><div class="catShade"></div>':'';
   return '<a class="cat" href="produtos.html?categoria='+encodeURIComponent(c.nome)+'">'+img+'<div><span>0'+(i+1)+'</span><strong>'+c.nome+'</strong><small>'+c.descricao+'</small></div></a>';
  }).join("");
 }catch(e){
  el.innerHTML=CATEGORIAS.map((c,i)=>'<a class="cat" href="produtos.html?categoria='+encodeURIComponent(c.nome)+'"><div><span>0'+(i+1)+'</span><strong>'+c.nome+'</strong><small>'+c.descricao+'</small></div></a>').join("");
 }
}
carregarCategorias();
</script></main><footer><div class="wrap foot"><div><b>DELÍRIO <span>ÍNTIMO</span></b></div><div class="footerLinks"><a href="https://instagram.com/delirio.intimo_" target="_blank" rel="noopener">Instagram</a><span> · </span><a href="https://wa.me/5513991808683" target="_blank" rel="noopener">WhatsApp</a></div><div>© 2026 Delírio Íntimo</div></div></footer></body></html>
