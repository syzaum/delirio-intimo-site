<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Em manutenção — Delírio Íntimo</title>
<style>
:root{color-scheme:dark;--bg:#090909;--pink:#ff3f98;--white:#fff;--muted:#b8b8b8;--line:#292929}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,rgba(255,63,152,.10),transparent 48%),var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif;text-align:center}
main{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;padding:36px 24px}
.logo{display:block;width:min(230px,70vw);max-height:180px;object-fit:contain;margin-bottom:34px}
.eyebrow{color:var(--pink);text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:800;margin-bottom:15px}
h1{margin:0;font-size:clamp(38px,8vw,58px);line-height:.98;letter-spacing:-2.5px}
h1 span{color:var(--pink)}
p{max-width:390px;margin:20px 0 0;color:var(--muted);font-size:15px;line-height:1.7}
.status{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:10px 15px;border:1px solid var(--line);border-radius:999px;color:#ddd;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px rgba(255,63,152,.65)}
.contact{display:inline-block;margin-top:27px;padding:13px 21px;border-radius:999px;background:var(--pink);color:#090909;text-decoration:none;font-size:12px;font-weight:900;letter-spacing:.4px;transition:transform .2s,opacity .2s}
.contact:hover{transform:translateY(-2px);opacity:.92}
footer{position:fixed;bottom:18px;left:16px;right:16px;color:#666;font-size:11px;text-align:center}
@media(max-width:480px){body{padding:18px}main{padding:20px 6px 45px}.logo{width:min(190px,65vw);margin-bottom:28px}p{font-size:14px}}
</style>
</head>
<body>
<main>
<img class="logo" src="logo.png" alt="Delírio Íntimo">
<div class="eyebrow">Estamos preparando novidades</div>
<h1>Voltamos <span>em breve.</span></h1>
<p>Nossa loja está passando por uma manutenção rápida para deixar tudo certinho para você. Em breve estaremos de volta!</p>
<div class="status"><span class="dot" aria-hidden="true"></span>Site temporariamente em manutenção</div>
<a class="contact" href="https://wa.me/5513991808683" target="_blank" rel="noopener noreferrer">FALAR PELO WHATSAPP</a>
</main>
<footer>© 2026 Delírio Íntimo · Obrigado pela compreensão 💗</footer>
</body>
</html>
